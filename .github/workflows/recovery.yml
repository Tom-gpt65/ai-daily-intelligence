name: Automatic missed-edition recovery

on:
  schedule:
    - cron: '20 8 * * *'
      timezone: 'Asia/Hong_Kong'
    - cron: '40 9 * * *'
      timezone: 'Asia/Hong_Kong'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  check-and-recover:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Check public edition and dispatch recovery only if necessary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/recover_daily.py
