name: iPhone browser regression — Chromium and WebKit

on:
  pull_request:
    branches: [main]
    paths:
      - 'site/cloud-sync.js'
      - 'tests/browser_cloud_sync.js'
      - 'tests/browser_cloud_email.js'
      - 'tests/browser_cloud_password.js'
      - 'site/app.js'
      - '.github/workflows/browser-v7.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/browser-v7.yml'
      - 'tests/browser_regression_v7.js'
      - 'tests/status_regression_v8.js'
      - 'tests/browser_layout_v11.js'
      - 'tests/browser_v12_layout.js'
      - 'tests/browser_cloud_sync.js'
      - 'tests/browser_cloud_password.js'
      - 'site/app.js'
      - 'site/cloud-sync.js'
      - 'site/cloud-config.json'
      - 'site/v1.css'
      - 'site/v6.css'
      - 'site/v11.css'
      - 'site/v12.css'
      - 'site/sw.js'
      - 'site/index.html'
      - 'site/reports/**'
  workflow_dispatch:
  # Daily browser quality check, no production site changes.
  schedule:
    - cron: '20 15 * * *'
      timezone: 'Asia/Hong_Kong'

permissions:
  contents: read

jobs:
  iphone:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reuse free Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-linux-ubuntu2404-v1.55.0-chromium-webkit
      - name: Install browser test dependency and engines
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Serve the static reading site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory site > /tmp/reading-server.log 2>&1 &
          echo $! > /tmp/reading-server.pid
          for n in $(seq 1 30); do
            curl -sf http://127.0.0.1:8765/ > /dev/null && break
            sleep 1
          done
      - name: Exercise 320px–430px iPhone-sized screens
        run: node tests/browser_regression_v7.js
      - name: Verify recovered-versus-scheduled status on iPad and desktop-width screens
        run: node tests/status_regression_v8.js
      - name: Verify reflow, headings, safe reader reset and fresh PWA shell
        run: node tests/browser_layout_v11.js
      - name: Verify v12 responsive chapter navigation and reader reset
        run: node tests/browser_v12_layout.js
      - name: Verify simulated two-device cloud vocabulary interactions
        run: node tests/browser_cloud_sync.js
      - name: Verify iPad and Chromium Magic Link feedback without sending real email
        run: node tests/browser_cloud_email.js
      - name: Verify password login and cross-device sync without SMTP in Chromium/WebKit
        run: node tests/browser_cloud_password.js
      - name: Browser smoke summary
        if: always()
        run: |
          echo "Mobile browser smoke: simulated iPhone widths in Chromium and WebKit." >> "$GITHUB_STEP_SUMMARY"
          echo "Translation responses are mocked; this does not guarantee live provider capacity." >> "$GITHUB_STEP_SUMMARY"
