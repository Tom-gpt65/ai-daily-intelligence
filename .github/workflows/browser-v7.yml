name: iPhone browser regression — Chromium and WebKit

on:
  pull_request:
    branches: [main]
    paths:
      - 'package*.json'
      - 'tests/run_js_tests.js'
      - 'tests/fixtures/legacy-sw-*.js'
      - 'site/sw.js'
      - 'site/index.html'
      - 'site/release.json'
      - 'site/*glossary.json'
      - 'tests/browser_v2_upgrade.js'
      - 'tests/fixtures/legacy-sw-v1.js'
      - '.github/workflows/daily.yml'
      - '.github/workflows/early-reading.yml'
      - 'tests/test_v6.py'
      - 'tests/test_daily_guarantee.py'
      - 'site/cloud-sync.js'
      - 'site/reading-theme-v1.css'
      - 'tests/browser_reading_theme_v1.js'
      - 'tests/browser_pwa_offline_final.js'
      - 'tests/browser_cloud_sync.js'
      - 'tests/browser_cloud_email.js'
      - 'tests/browser_cloud_password.js'
      - 'site/app.js'
      - '.github/workflows/browser-v7.yml'
  push:
    branches: [main]
    paths:
      - 'package*.json'
      - 'tests/run_js_tests.js'
      - 'tests/fixtures/legacy-sw-*.js'
      - 'site/release.json'
      - 'site/*glossary.json'
      - 'tests/browser_v2_upgrade.js'
      - 'tests/fixtures/legacy-sw-v1.js'
      - '.github/workflows/browser-v7.yml'
      - 'tests/browser_regression_v7.js'
      - 'tests/status_regression_v8.js'
      - 'tests/browser_layout_v11.js'
      - 'tests/browser_v12_layout.js'
      - 'tests/browser_cloud_sync.js'
      - 'tests/browser_cloud_password.js'
      - 'site/app.js'
      - 'site/cloud-sync.js'
      - 'site/cloud-config.json'
      - 'site/v1.css'
      - 'site/reading-theme-v1.css'
      - 'tests/browser_reading_theme_v1.js'
      - 'tests/browser_pwa_offline_final.js'
      - 'site/v6.css'
      - 'site/v11.css'
      - 'site/v12.css'
      - 'site/sw.js'
      - 'site/index.html'
      - 'site/reports/**'
  workflow_dispatch:
  # Daily browser quality check, no production site changes.
  schedule:
    - cron: '20 15 * * *'
      timezone: 'Asia/Hong_Kong'

permissions:
  contents: read

jobs:
  iphone:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reuse free Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-linux-ubuntu2404-v1.55.0-chromium-webkit
      - name: Install browser test dependency and engines
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium webkit
      - name: Run all browser regressions with guaranteed server cleanup
        run: node tests/run_js_tests.js --browser
      - name: Browser smoke summary
        if: always()
        run: |
          echo "Mobile browser smoke: simulated iPhone widths in Chromium and WebKit." >> "$GITHUB_STEP_SUMMARY"
          echo "Translation responses are mocked; this does not guarantee live provider capacity." >> "$GITHUB_STEP_SUMMARY"
