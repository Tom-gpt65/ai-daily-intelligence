name: Historical preservation audit and legacy reconstruction preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify S2 protected withdrawal or reconstruct a legacy disposable preview
        run: python scripts/rebuild_v3_history.py
      - name: Retain generated preview for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-preview
          path: |
            .cache/history-preview/
            content-history/retired/withdrawn-manifest.json
          if-no-files-found: warn
