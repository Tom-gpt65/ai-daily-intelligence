name: Validate long-form reading without Pages deployment

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'site/**'
      - '.github/workflows/daily.yml'
      - '.github/workflows/first-attempt-canary.yml'
      - '.github/workflows/early-reading.yml'
      - '.github/workflows/recovery.yml'
      - 'site/cloud-sync.js'
      - 'docs/SUPABASE_VOCABULARY.sql'
      - 'tests/**'
      - '.github/workflows/longform-validation.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/longform-validation.yml'
      - '.github/workflows/daily.yml'
      - '.github/workflows/first-attempt-canary.yml'
      - '.github/workflows/early-reading.yml'
      - '.github/workflows/recovery.yml'
      - 'scripts/**'
      - 'tests/**'
      - 'site/reports/**'
      - 'site/app.js'
      - 'site/cloud-sync.js'
      - 'site/cloud-config.json'
      - 'site/v1.css'
      - 'site/reading-theme-v1.css'
      - 'site/index.html'
  workflow_dispatch:
  # Independent non-deploying health check: 15:05 Hong Kong time every day.
  schedule:
    - cron: '5 15 * * *'
      timezone: 'Asia/Hong_Kong'

permissions:
  contents: read

jobs:
  longform:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Check every regression and public English word count
        shell: bash
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate_site.py
          python scripts/morning_canary.py
          node --check site/app.js
          node --check site/cloud-sync.js
          node tests/cloud_sync_test.js
          node tests/cloud_integration_test.js
          node tests/cloud_password_test.js
          node --check tests/browser_pwa_offline_final.js
          node tests/reading_theme_tokens_v1.js
          node --check site/sw.js
          python - <<'PY'
          import json,re,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from edition_guarantee import complete
          root=Path('site/reports')
          index=json.loads((root/'index.json').read_text(encoding='utf-8'))
          assert isinstance(index,list) and index,'No archived reading entries'
          assert [r['date'] for r in index]==sorted([r['date'] for r in index],reverse=True)
          for row in index:
              article=json.loads((root/(row['date']+'.json')).read_text(encoding='utf-8'))
              words=len(re.findall(r"\b[A-Za-z]+(?:['’-][A-Za-z]+)*\b"," ".join(article['essay'])))
              assert 1000<=words<=1550,(row['date'],words,'Reading length')
              assert article['word_count']==row['word_count']==words
              assert complete(article),(row['date'],'Offline dictionary incomplete')
              assert len(article.get('practice',{}).get('items',[]))>=7,(row['date'],'Missing reading questions')
              if article['mode']=='reading_feature':
                  assert not article['stories'],(row['date'],'Backup presented as news')
              else:
                  assert article['mode'] in ('editorial','source_digest')
                  assert len(article['stories'])>=3,(row['date'],'News needs three sources')
              print('ARCHIVE EDITION VERIFIED',row['date'],'words=',words,'mode=',article['mode'])
          PY
