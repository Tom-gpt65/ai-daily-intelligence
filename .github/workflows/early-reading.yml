name: Early daily English reading safety net

on:
  schedule:
    - cron: '5 7 * * *'
      timezone: 'Asia/Hong_Kong'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/early-reading.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ai-daily-news
  cancel-in-progress: false

jobs:
  ready-by-morning:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install free dependencies
        id: optional-dependencies
        # Only OpenCC enrichment is optional; baseline dictionary is bundled.
        # A temporary package index outage must not prevent the FIRST run.
        continue-on-error: true
        timeout-minutes: 2
        run: python -m pip install -r requirements.txt
      # CI executes the full test suite on PR/push. Publication itself must
      # validate the shipped article and assets, not run mutable-content tests.
      - name: Note optional dependency failure without blocking reading
        if: steps.optional-dependencies.outcome == 'failure'
        run: echo "::warning title=Optional OpenCC unavailable::Published reading uses its bundled offline glossary."
      - name: Validate reserve and website contract
        run: |
          python scripts/validate_site.py
          node --check site/app.js
          node --check site/cloud-sync.js
          node --check site/sw.js
      - name: Ensure dated offline-complete educational passage
        run: python scripts/reading_backup.py --if-missing
      # Validate today's ACTUAL newly generated reserve, not just yesterday's
      # archive: prevents handing an invalid 07:05 state to the 07:40 job.
      - name: Re-validate actual morning edition before publication
        run: python scripts/validate_site.py
      - name: Conflict-safe publish without deleting previous reading history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/publish_reports.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy site
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Verify the accepted reading is actually public
        run: python scripts/verify_publication.py --live
