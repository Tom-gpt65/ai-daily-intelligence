name: Source-conditioned generation acceptance

on:
  pull_request:
    branches: [main]
    paths: ['scripts/source_analysis.py', 'scripts/source_selection.py', 'scripts/replay_generation.py', '.github/workflows/generation-replay.yml', 'tests/fixtures/oct11-rss-snapshot.json']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generation-replay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-generation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Install local free analysis runtime
        timeout-minutes: 10
        run: |
          curl --fail --location --retry 2 --max-time 120 https://ollama.com/install.sh -o /tmp/install-ollama.sh
          sh /tmp/install-ollama.sh
          (ollama serve >/tmp/ollama.log 2>&1 &)
          for n in $(seq 1 30); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break
            sleep 2
          done
          timeout 480 ollama pull qwen2.5:7b-instruct-q4_K_M
      - name: Download optional pinned dictionary
        timeout-minutes: 3
        run: |
          mkdir -p .cache
          curl --fail --location --retry 2 --max-time 120 https://raw.githubusercontent.com/skywind3000/ECDICT/bc015ed2e24a7abef49fc6dbbb7fe32c1dadaf8b/ecdict.csv -o .cache/ecdict.csv
      - name: Generate and validate from the real captured source pool
        env:
          ANALYSIS_ENABLED: '1'
        run: python scripts/replay_generation.py --fresh
      - name: Preserve exact rejection or acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-analysis-acceptance
          path: .cache/generation-replay/
          if-no-files-found: warn
          retention-days: 14
