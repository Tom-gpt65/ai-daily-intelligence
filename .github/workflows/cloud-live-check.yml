name: Verify live V1 cloud configuration and anonymous isolation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloud-live-check.yml'
      - 'site/cloud-config.json'
      - 'site/cloud-sync.js'
      - 'site/reading-theme-v1.css'
      - 'site/index.html'
      - 'site/sw.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployed cloud settings without printing keys
        run: |
          python3 - <<'PY'
          import json, pathlib, time, urllib.request, urllib.error
          expected=json.loads(pathlib.Path('site/cloud-config.json').read_text(encoding='utf-8'))
          assert expected['supabase_url'].startswith('https://') and expected['anon_key'].startswith('sb_publishable_')
          base='https://tom-gpt65.github.io/ai-daily-intelligence/'
          def get(url,headers=None):
              request=urllib.request.Request(url,headers={'User-Agent':'V1-Cloud-Readiness/1','Cache-Control':'no-cache',**(headers or {})})
              try:
                  with urllib.request.urlopen(request,timeout=20) as response:
                      return response.status,response.read().decode('utf-8')
              except urllib.error.HTTPError as error:
                  return error.code,error.read().decode('utf-8')
          for attempt in range(12):
              try:
                  status,body=get(base+'cloud-config.json')
                  assert status==200, 'Live public configuration missing'
                  assert json.loads(body)==expected,'Public Pages config has not caught up with main'
                  status,js=get(base+'cloud-sync.js')
                  assert status==200 and 'created_at.asc,batch_order.asc,event_id.asc' in js,'Live cloud script is outdated'
                  assert '連線等待超過 20 秒' in js,'Live cloud email timeout feedback not deployed'
                  assert 'async signInWithPassword(email,password)' in js,'Live mail-free password login missing'
                  status,app=get(base+'app.js')
                  assert status==200 and '正在聯絡 Supabase…' in app,'Live email submit progress code missing'
                  status,html=get(base+'index.html')
                  assert status==200 and 'id="sync-email-feedback"' in html,'Live email feedback element missing'
                  assert 'id="sync-password-login"' in html and 'id="sync-password"' in html,'Live password UI missing'
                  assert './reading-theme-v1.css?v=2' in html,'Paper Calm stylesheet not referenced'
                  assert "preference==='false'" in html,'First-paint saved theme bootstrap missing'
                  status,theme=get(base+'reading-theme-v1.css')
                  assert status==200 and '--reader-paper: #FFFDF8' in theme and '--reader-paper: #22292A' in theme,'Public theme tokens outdated'
                  assert '--nav-border: #737E73' in theme and '--focus-ring: #2B6378' in theme,'Accessible navigation or focus tokens missing'
                  status,worker=get(base+'sw.js')
                  assert status==200 and 'ai-daily-V2-stable-reading' in worker,'Public offline shell outdated'
                  print('LIVE V1 CLOUD CONFIG, PAPER CALM, SOFT GRAPHITE AND AUTH VERIFIED')
                  break
              except (OSError,ValueError,AssertionError) as error:
                  if attempt==11: raise
                  print('Waiting for Pages configuration propagation, attempt',attempt+1)
                  time.sleep(10)
          api=expected['supabase_url'].rstrip('/')
          health_status,_=get(api+'/auth/v1/health',{'apikey':expected['anon_key']})
          assert health_status==200, 'Supabase Auth health endpoint unavailable: HTTP '+str(health_status)
          print('SUPABASE AUTH HEALTH VERIFIED')
          status,body=get(api+'/rest/v1/vocabulary_events?select=event_id&limit=1',{'apikey':expected['anon_key']})
          assert status in (200,401,403),'Unexpected anonymous vocabulary API status: '+str(status)
          if status==200:
              assert json.loads(body)==[],'Anonymous access exposed vocabulary events'
          print('ANONYMOUS VOCABULARY DATA NOT EXPOSED; HTTP',status)
          print('IMPORTANT: Actual user login, two-account isolation and two-device sync still need live manual testing')
          PY
