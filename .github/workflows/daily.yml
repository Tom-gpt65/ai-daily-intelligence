name: AI Daily Intelligence — free daily briefing

on:
  schedule:
    - cron: '40 7 * * *'
      timezone: 'Asia/Hong_Kong'
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily.yml'
      - 'scripts/**'
      - 'requirements.txt'
      - 'site/**'
      - '!site/reports/**'
      - '!site/system-status.json'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ai-daily-${{ github.event_name == 'push' && 'code' || 'news' }}
  # Discard superseded code-only deploys, but never cancel daily news generation.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  daily:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Check out project
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install free dependencies
        id: optional-dependencies
        # Only OpenCC enrichment is optional; baseline dictionary is bundled.
        # A temporary package index outage must not prevent the FIRST run.
        continue-on-error: true
        run: python -m pip install -r requirements.txt

      # Full Python/Node/browser regressions run in CI on every change.
      # Scheduled publication must not depend on tests that inspect a mutable
      # latest article: 07:05 intentionally publishes reading_feature first.
      - name: Validate existing public edition before news generation
        id: site-preflight
        run: |
          python scripts/validate_site.py
          node --check site/app.js
          node --check site/cloud-sync.js
          node --check site/sw.js

      - name: Collect recent RSS headlines
        if: github.event_name != 'push'
        # RSS network/timeouts must not prevent today's safe reading edition.
        # The final publication safety gate still rejects malformed content.
        continue-on-error: true
        id: preflight
        shell: bash
        env:
          ENRICH_ENABLED: '1'
        run: |
          python scripts/build.py --prefetch
          if test -s .cache/candidates.json; then
            echo "news=true" >> "$GITHUB_OUTPUT"
            python - <<'PY' >> "$GITHUB_OUTPUT"
          import json,sys
          sys.path.insert(0,'scripts')
          from build import source_evidence_metrics
          with open('.cache/candidates.json',encoding='utf-8') as stream:
              data=json.load(stream)
          evidence=source_evidence_metrics(data.get('stories',[]))
          print('enough='+str(evidence['sufficient']).lower())
          PY
          else
            echo "news=false" >> "$GITHUB_OUTPUT"
            echo "enough=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache optional offline dictionary
        if: steps.preflight.outputs.news == 'true'
        uses: actions/cache@v4
        with:
          path: .cache/ecdict.csv
          key: ecdict-2026-v1

      - name: Download optional dictionary
        if: steps.preflight.outputs.news == 'true'
        run: |
          mkdir -p .cache
          if ! test -s .cache/ecdict.csv; then
            curl --fail --location --retry 2 --max-time 180 \
              https://raw.githubusercontent.com/skywind3000/ECDICT/master/ecdict.csv \
              -o .cache/ecdict.csv || echo "Dictionary unavailable: using built-in vocabulary"
          fi

      - name: Install free local model when relevant
        if: steps.preflight.outputs.enough == 'true'
        id: ollama
        continue-on-error: true
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > /tmp/ollama.log 2>&1 &)
          for n in $(seq 1 30); do
            curl -fsS http://localhost:11434/api/tags >/dev/null && break
            sleep 2
          done
          timeout 480 ollama pull phi3:mini

      - name: Generate daily briefing
        if: steps.preflight.outputs.news == 'true'
        # A provider/model crash is a degraded NEWS attempt, not a reason to
        # discard the existing offline-complete 07:05 article.
        continue-on-error: true
        id: build
        env:
          OLLAMA_ENABLED: ${{ steps.ollama.outcome == 'success' && '1' || '0' }}
          OLLAMA_MODEL: phi3:mini
          TRANSLATE_ENABLED: '0'
        run: |
          python scripts/build.py --use-prefetch
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from pathlib import Path
          status=json.loads(Path("site/system-status.json").read_text(encoding="utf-8"))
          today=datetime.now(ZoneInfo("Asia/Hong_Kong")).date().isoformat()
          generated=(status.get("state")=="published" and status.get("latest_date")==today)
          print("generated="+str(generated).lower())
          PY

      - name: Guarantee today's reading passage, even if RSS or the model fails
        # With an approved site preflight, always try a verified backup after
        # transient RSS/model failures; do not bypass genuine validation errors.
        if: ${{ always() && github.event_name != 'push' && steps.site-preflight.outcome == 'success' }}
        id: passage
        run: |
          python scripts/reading_backup.py --if-missing
          echo "generated=true" >> "$GITHUB_OUTPUT"

      - name: Validate FINAL dated article before publishing
        if: ${{ github.event_name != 'push' && steps.passage.outcome == 'success' }}
        run: |
          python scripts/validate_site.py
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import json
          today=datetime.now(ZoneInfo("Asia/Hong_Kong")).date().isoformat()
          index=json.loads(Path("site/reports/index.json").read_text(encoding="utf-8"))
          assert index and index[0]["date"]==today,"Daily publication cannot publish a stale article"
          report=json.loads(Path("site/reports",today+".json").read_text(encoding="utf-8"))
          assert report.get("mode") in ("source_digest","editorial","reading_feature")
          print("FINAL PUBLICATION ACCEPTED:",today,report["mode"])
          PY

      - name: Report degraded external news (without claiming current news)
        if: ${{ always() && github.event_name != 'push' && steps.passage.outcome == 'success' }}
        env:
          DEPENDENCY_OUTCOME: ${{ steps.optional-dependencies.outcome }}
          FEED_OUTCOME: ${{ steps.preflight.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          NEWS_GENERATED: ${{ steps.build.outputs.generated }}
        run: |
          if [ "$NEWS_GENERATED" != "true" ]; then
            python - <<'PY'
          import json,os
          from pathlib import Path
          status_path=Path("site/system-status.json")
          info=json.loads(status_path.read_text(encoding="utf-8")) if status_path.exists() else {}
          reason=info.get("state","unavailable")
          missing=info.get("missing_examples",[])
          detail="; missing words: "+", ".join(str(w) for w in missing[:12]) if missing else ""
          print(f"::warning title=News NOT published::The workflow can succeed while only an educational fallback is published. Reason: {reason}{detail}")
          summary=os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary,"a",encoding="utf-8") as stream:
                  stream.write("\n### News publication outcome: EDUCATIONAL FALLBACK, not current news\n")
                  stream.write(f"- Reason: {reason}{detail}\n")
                  stream.write("- A green GitHub Actions run confirms a valid deployment, not a sourced-news publication.\n")
          PY
          fi
          if [ "$DEPENDENCY_OUTCOME" = "failure" ]; then
            echo "::warning title=Optional conversion unavailable::OpenCC installation failed; bundled offline Chinese glossary remains in use."
            echo "- Optional OpenCC install failed: bundled offline meanings retained." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$FEED_OUTCOME" = "failure" ]; then
            echo "::warning title=News feed prefetch unavailable::RSS/network collection failed; validated educational reading was preserved."
            echo "- External RSS collection failed: safe dated reading fallback retained." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$BUILD_OUTCOME" = "failure" ]; then
            echo "::warning title=News generation degraded::Daily news build failed; validated educational reading was preserved."
            echo "- News generation failed: safe dated reading fallback retained." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Summarise run status
        if: always()
        run: |
          if test -s site/system-status.json; then
            python -c "import json; print('### Daily report status'); print(json.dumps(json.load(open('site/system-status.json')), indent=2, ensure_ascii=False))" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit published reports without racing repository edits
        if: github.event_name != 'push' && steps.passage.outputs.generated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/publish_reports.py

      - name: Configure Pages deployment
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy website
        id: publish
        uses: actions/deploy-pages@v4
