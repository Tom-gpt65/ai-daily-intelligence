name: S2 automatic reading preparation

on:
  schedule:
    - cron: '0 14,20 * * *'
      timezone: 'Asia/Hong_Kong'
  pull_request:
    branches: [main]
    paths: ['scripts/s2_reading.py', '.github/workflows/s2-prepare.yml']
  workflow_dispatch:
    inputs:
      start:
        description: First Hong Kong reading date (YYYY-MM-DD; blank = tomorrow)
        default: ''
      days:
        description: Number of future readings (1–3)
        default: '3'

permissions:
  contents: write

concurrency:
  group: s2-preparation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  real-generation:
    strategy:
      fail-fast: false
      matrix:
        offset: [0, 1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Install free local generation runtime
        timeout-minutes: 10
        run: |
          curl --fail --location --retry 2 --max-time 120 https://ollama.com/install.sh -o /tmp/install-ollama.sh
          sh /tmp/install-ollama.sh
          (ollama serve >/tmp/ollama.log 2>&1 &)
          for n in $(seq 1 30); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break
            sleep 2
          done
          timeout 480 ollama pull qwen2.5:7b-instruct-q4_K_M
      - name: Download pinned offline dictionary
        timeout-minutes: 3
        run: |
          mkdir -p .cache
          curl --fail --location --retry 2 --max-time 120 https://raw.githubusercontent.com/skywind3000/ECDICT/bc015ed2e24a7abef49fc6dbbb7fe32c1dadaf8b/ecdict.csv -o .cache/ecdict.csv
      - name: Automatically generate and review complete future readings
        id: prepare
        env:
          START: ${{ inputs.start }}
          DAYS: ${{ inputs.days || '3' }}
          OFFSET: ${{ matrix.offset }}
        run: |
          if ! [[ "$DAYS" =~ ^[1-3]$ ]]; then echo 'days must be 1 to 3'; exit 1; fi
          if [ -z "$START" ]; then START=$(TZ=Asia/Hong_Kong date -d tomorrow +%F); fi
          if [ "$OFFSET" -ge "$DAYS" ]; then exit 0; fi
          START=$(date -d "$START + $OFFSET days" +%F)
          python scripts/s2_reading.py --start "$START" --days 1 --attempts 2
      - name: Publish accepted reserves against the latest main branch
        if: always() && github.ref == 'refs/heads/main' && matrix.offset < fromJSON(inputs.days || '3')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/s2_reserve.py --publish .cache/s2-preparation
      - name: Preserve accepted readings and exact rejection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s2-preparation-${{ matrix.offset }}
          path: .cache/s2-preparation/
          if-no-files-found: warn
          retention-days: 30
