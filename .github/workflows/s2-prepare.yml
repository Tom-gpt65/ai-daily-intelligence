name: S2 automatic reading preparation

on:
  schedule:
    - cron: '0 14,20 * * *'
      timezone: 'Asia/Hong_Kong'
  pull_request:
    branches: [main]
    paths: ['scripts/s2_reading.py', '.github/workflows/s2-prepare.yml']
  workflow_dispatch:
    inputs:
      start:
        description: First Hong Kong reading date (YYYY-MM-DD; blank = tomorrow)
        default: ''
      days:
        description: Number of future readings (1–3)
        default: '3'

permissions:
  contents: write

concurrency:
  group: s2-preparation-${{ github.event.pull_request.number || github.ref }}
  # PR runs are disposable acceptance tests for one code revision. Supersede
  # obsolete revisions; production preparation must finish and publish safely.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      start: ${{ steps.plan.outputs.start }}
      days: ${{ steps.plan.outputs.days }}
      offsets: ${{ steps.plan.outputs.offsets }}
    steps:
      - id: plan
        env:
          START: ${{ inputs.start }}
          DAYS: ${{ inputs.days || '3' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os,json
          from datetime import datetime,date,timedelta
          from zoneinfo import ZoneInfo
          days=int(os.environ['DAYS'])
          if not 1<=days<=3:raise ValueError('days must be 1 to 3')
          start=date.fromisoformat(os.environ['START']) if os.environ['START'] else date(2026,10,12) if os.environ['EVENT_NAME']=='pull_request' else datetime.now(ZoneInfo('Asia/Hong_Kong')).date()+timedelta(days=1)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('start='+start.isoformat()+'\ndays='+str(days)+'\noffsets='+json.dumps(list(range(days)))+'\n')
          PY
  real-generation:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        offset: ${{ fromJSON(needs.plan.outputs.offsets) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select one immutable reading date and avoid regenerating accepted packs
        id: selected
        env:
          START: ${{ needs.plan.outputs.start }}
          OFFSET: ${{ matrix.offset }}
        run: |
          python - <<'PY'
          import os,sys,json
          from datetime import date,timedelta
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from s2_reserve import load
          day=(date.fromisoformat(os.environ['START'])+timedelta(days=int(os.environ['OFFSET']))).isoformat()
          existing=load(day,Path('site/reports'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('start='+day+'\ngenerate='+str(existing is None).lower()+'\n')
          PY
      - run: python -m pip install -r requirements.txt
        if: steps.selected.outputs.generate == 'true' 
      - name: Install free local generation runtime
        if: steps.selected.outputs.generate == 'true'
        timeout-minutes: 10
        run: |
          curl --fail --location --retry 2 --max-time 120 https://ollama.com/install.sh -o /tmp/install-ollama.sh
          sh /tmp/install-ollama.sh
          (ollama serve >/tmp/ollama.log 2>&1 &)
          for n in $(seq 1 30); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break
            sleep 2
          done
          timeout 480 ollama pull qwen2.5:7b-instruct-q4_K_M
      - name: Download pinned offline dictionary
        if: steps.selected.outputs.generate == 'true'
        timeout-minutes: 3
        run: |
          mkdir -p .cache
          curl --fail --location --retry 2 --max-time 120 https://raw.githubusercontent.com/skywind3000/ECDICT/bc015ed2e24a7abef49fc6dbbb7fe32c1dadaf8b/ecdict.csv -o .cache/ecdict.csv
      - name: Automatically generate and review complete future readings
        id: prepare
        env:
          START: ${{ steps.selected.outputs.start }}
        run: python scripts/s2_reading.py --start "$START" --days 1 --attempts 3
      - name: Publish accepted reserves against the latest main branch
        if: always() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/s2_reserve.py --publish .cache/s2-preparation
      - name: Preserve accepted readings and exact rejection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s2-preparation-${{ matrix.offset }}
          path: .cache/s2-preparation/
          if-no-files-found: warn
          retention-days: 30
